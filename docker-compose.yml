version: '3.8'

services:
  # PostgreSQL Database for Synapse
  postgres:
    image: postgres:15-alpine
    container_name: matrix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --data-checksums
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    networks:
      - ${DOCKER_NETWORK}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  # Redis for Synapse caching
  redis:
    image: redis:7-alpine
    container_name: matrix-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./redis/data:/data
    networks:
      - ${DOCKER_NETWORK}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Matrix Synapse Server
  synapse:
    image: matrixdotorg/synapse:latest
    container_name: matrix-synapse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SYNAPSE_SERVER_NAME: ${SYNAPSE_SERVER_NAME}
      SYNAPSE_CONFIG_PATH: ${SYNAPSE_CONFIG_PATH}
      SYNAPSE_REPORT_STATS: ${SYNAPSE_REPORT_STATS}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SYNAPSE_SHARED_SECRET: ${SYNAPSE_SHARED_SECRET}
      UID: 1000
      GID: 1000
    volumes:
      - ./synapse/data:/data
      - ./synapse/config:/config
      - ./synapse/logs:/logs
      - ./synapse/media:/media
      - ./synapse/uploads:/uploads
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "${SYNAPSE_PORT}:8008"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    tmpfs:
      - /tmp:size=100M,mode=1777
    deploy:
      resources:
        limits:
          memory: ${SYNAPSE_MEMORY_LIMIT}
          cpus: ${SYNAPSE_CPU_LIMIT}

  # Element X Web Client
  element-x:
    image: vectorim/element-x-web:latest
    container_name: matrix-element-x
    restart: unless-stopped
    environment:
      ELEMENT_X_SERVER: ${ELEMENT_X_SERVER}
      ELEMENT_X_BASE_URL: ${ELEMENT_X_BASE_URL}
      ELEMENT_X_DEFAULT_THEME: light
      ELEMENT_X_DEFAULT_LANG: en
      ELEMENT_X_ENABLE_REGISTRATION: "false"
      ELEMENT_X_ENABLE_GUEST_ACCESS: "false"
      ELEMENT_X_ENABLE_CALLS: "true"
      ELEMENT_X_ENABLE_VIDEO_CALLS: "true"
      ELEMENT_X_ENABLE_VOICE_CALLS: "true"
      ELEMENT_X_ENABLE_SCREEN_SHARING: "true"
      ELEMENT_X_JITSI_SERVER: ""
      ELEMENT_X_JITSI_PREFER_SERVER: "false"
      ELEMENT_X_JITSI_WIDGET: "true"
      ELEMENT_X_JITSI_WIDGET_DOMAIN: ""
      ELEMENT_X_BRAND: "Element X"
      ELEMENT_X_BRANDING: '{"welcomeBackgroundUrl": "", "authHeaderLogoUrl": ""}'
      ELEMENT_X_FEATURES: '{"feature_voice_and_video": true, "feature_screen_sharing": true}'
      # LiveKit RTC configuration
      ELEMENT_X_RTC_BACKEND: "livekit"
      ELEMENT_X_LIVEKIT_SERVER: "ws://${MATRIX_DOMAIN}:7881"
      ELEMENT_X_LIVEKIT_KEY: ${LIVEKIT_KEY}
      ELEMENT_X_LIVEKIT_SECRET: ${LIVEKIT_SECRET}
    volumes:
      - ./element/config:/config
      - ./element/data:/data
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "${ELEMENT_X_PORT}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=50M,mode=1777
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: matrix-nginx
    restart: unless-stopped
    depends_on:
      synapse:
        condition: service_healthy
      element-x:
        condition: service_healthy
      livekit:
        condition: service_healthy
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_SSL_PORT}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/logs:/var/log/nginx
      - ./nginx/html:/usr/share/nginx/html
    networks:
      - ${DOCKER_NETWORK}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=50M,mode=1777
      - /var/cache/nginx:size=100M,mode=1777
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

  # Turn Server for Element Call (STUN/TURN)
  coturn:
    image: coturn/coturn:latest
    container_name: matrix-coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_LISTENING_PORT: 3478
      TURN_MIN_PORT: 49152
      TURN_MAX_PORT: 65535
      TURN_LISTENING_IP: 0.0.0.0
      TURN_EXTERNAL_IP: ${MATRIX_DOMAIN}
      TURN_REALM: ${MATRIX_DOMAIN}
      TURN_AUTH_SECRET: ${TURN_AUTH_SECRET}
      TURN_USER_QUOTA: 12
      TURN_TOTAL_QUOTA: 1200
      TURN_MAX_BPS: 10000000
      TURN_NO_CLI: true
      TURN_NO_TLSV1: true
      TURN_NO_TLSV1_1: true
    volumes:
      - ./coturn/config:/etc/coturn
      - ./coturn/logs:/var/log/coturn
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # LiveKit Server for Element Call (Alternative RTC backend)
  livekit:
    image: livekit/livekit-server:latest
    container_name: matrix-livekit
    restart: unless-stopped
    environment:
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
      LIVEKIT_HOST: ${MATRIX_DOMAIN}
      LIVEKIT_PORT: 7880
      LIVEKIT_WS_HOST: ${MATRIX_DOMAIN}
      LIVEKIT_WS_PORT: 7881
      LIVEKIT_RTC_HOST: ${MATRIX_DOMAIN}
      LIVEKIT_RTC_PORT: 7882
      LIVEKIT_TURN_HOST: ${MATRIX_DOMAIN}
      LIVEKIT_TURN_PORT: 3478
      LIVEKIT_TURN_USERNAME: ${MATRIX_DOMAIN}
      LIVEKIT_TURN_PASSWORD: ${TURN_AUTH_SECRET}
    ports:
      - "7880:7880"   # HTTP API
      - "7881:7881"   # WebSocket
      - "7882:7882"   # RTC (UDP)
      - "7882:7882/udp" # RTC (UDP)
    volumes:
      - ./livekit/config:/config
      - ./livekit/data:/data
    networks:
      - ${DOCKER_NETWORK}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # Matrix RTC Bridge (for Synapse RTC support)
  matrix-rtc:
    image: matrixdotorg/matrix-rtc:latest
    container_name: matrix-rtc
    restart: unless-stopped
    environment:
      SYNAPSE_SERVER: http://synapse:8008
      SYNAPSE_SHARED_SECRET: ${SYNAPSE_SHARED_SECRET}
      TURN_SERVER: turn:${MATRIX_DOMAIN}:3478
      TURN_SHARED_SECRET: ${TURN_AUTH_SECRET}
      LIVEKIT_SERVER: ws://livekit:7881
      LIVEKIT_KEY: ${LIVEKIT_KEY}
      LIVEKIT_SECRET: ${LIVEKIT_SECRET}
    depends_on:
      synapse:
        condition: service_healthy
      coturn:
        condition: service_started
      livekit:
        condition: service_healthy
    networks:
      - ${DOCKER_NETWORK}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  ${DOCKER_NETWORK}:
    driver: bridge
    name: ${DOCKER_NETWORK}

volumes:
  postgres_data:
  redis_data:
  synapse_data:
  synapse_media:
  synapse_uploads:
  nginx_logs:
  coturn_logs:
  livekit_data: