# Docker Compose Override for Development
# This file provides development-specific configurations

version: '3.8'

services:
  # Development Synapse with debug logging
  synapse:
    environment:
      SYNAPSE_LOG_LEVEL: DEBUG
      SYNAPSE_ENABLE_METRICS: "true"
    ports:
      - "8008:8008"
      - "9000:9000"  # Metrics port
    volumes:
      - ./synapse/config:/config:ro
      - ./synapse/data:/data
      - ./synapse/logs:/logs
      - ./synapse/media:/media
      - ./synapse/uploads:/uploads

  # Development Element X with hot reload
  element-x:
    environment:
      NODE_ENV: development
      ELEMENT_X_ENABLE_REGISTRATION: "true"
      ELEMENT_X_ENABLE_GUEST_ACCESS: "true"
    ports:
      - "3000:80"
    volumes:
      - ./element/config:/config:ro

  # Development Nginx with debug
  nginx:
    environment:
      NGINX_DEBUG: "true"
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

  # Development PostgreSQL with more logging
  postgres:
    environment:
      POSTGRES_LOG_LEVEL: debug
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d

  # Development Redis with more logging
  redis:
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes --loglevel debug
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data:/data

  # Development CoTurn with debug
  coturn:
    environment:
      TURN_VERBOSE: "true"
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-65535:49152-65535/udp"
    volumes:
      - ./coturn/config:/etc/coturn:ro
      - ./coturn/logs:/var/log/coturn