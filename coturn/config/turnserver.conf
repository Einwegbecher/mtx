# CoTurn TURN Server Configuration for Element Call

# Basic configuration
listening-port=3478
listening-ip=0.0.0.0
external-ip=${MATRIX_DOMAIN}
realm=${MATRIX_DOMAIN}

# Authentication
use-auth-secret
static-auth-secret=your_turn_auth_secret_here

# User quota
user-quota=12
total-quota=1200

# Bandwidth limits
max-bps=10000000

# Security
no-cli
no-tlsv1
no-tlsv1_1

# Logging
log-file=/var/log/coturn/turnserver.log
verbose

# Network
min-port=49152
max-port=65535

# TLS configuration (optional)
# tls-listening-port=5349
# cert=/etc/coturn/cert.pem
# pkey=/etc/coturn/privkey.pem

# Performance
max-allocate-timeout=60
max-allocation-lifetime=3600
max-allocation-bandwidth=10000000

# NAT traversal
nat-traversal=on

# DTLS support for WebRTC
dtls-listening-port=5349

# Allow loops for testing
allow-loopback-peers

# IP filtering
# denied-peer-ip=192.168.0.0-192.168.255.255
# allowed-peer-ip=10.0.0.0-10.255.255.255